spring.application.name=spring-gift

# h2 console
spring.h2.console.enabled=true

# Database configuration
spring.datasource.url=jdbc:h2:mem:test;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# init sql
spring.sql.init.mode=embedded

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# error handling
server.error.path=/error

# jwt
gift.jwt.secret=b12277e4d918a0d95f2f5adc476cd3bff18911eb3d8f34fb5067f78326c5c6f0
# 1 day in seconds
gift.jwt.expiration=86400

## admin
gift.admin.email=test@test.com
gift.admin.password=qwerty1234@